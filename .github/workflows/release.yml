name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: .NET einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Das Tag (vX.Y.Z) ist die Version des Releases: App-Anzeige, EXE-Dateiversion
      # und MSIX-Paketversion werden daraus erzeugt, damit alle Stellen identisch sind.
      # Ergebnis ist das unsignierte Msix/bin/perPDF.msix (der Store signiert beim Einreichen).
      - name: MSIX bauen
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '${{ github.ref_name }}' hat nicht das Format vX.Y.Z" }
          ./Msix/MsixBauen.ps1 -Version $version

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: Msix/bin/perPDF.msix
          generate_release_notes: true
